<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Upload Free Fire IDs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card {
      width: 420px;
      padding: 2rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: #fff;
    }
    .admin-card h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; color: #aaa; margin-bottom: 0.4rem; font-size: 0.85rem; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95rem;
    }
    .upload-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c);
      color: #121417;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .upload-btn:hover { transform: scale(1.02); }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .status-info { background: rgba(0, 200, 255, 0.2); color: #00ffff; }
    .status-success { background: rgba(0, 255, 128, 0.2); color: #00ff80; }
    .status-error { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>Upload Free Fire ID 🔥</h2>
    <form id="upload-form">
      <div class="form-group">
        <label>Account Title / ID Name</label>
        <input type="text" id="title" placeholder="e.g., Level 75 Pro Account" required>
      </div>

      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="price" placeholder="e.g., 50" required>
      </div>

      <div class="form-group">
        <label>Image (PNG/JPG)</label>
        <input type="file" id="image-file" accept="image/*" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="EVO Guns, Rare Bundles..." required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="upload-btn">Upload Account</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // REPLACE with your actual Firebase config details
    const firebaseConfig = {
    apiKey: "AIzaSyCpAkYkSdsWkuNItiMQDXhNdMqoxSVy13A",
    authDomain: "mozan-76e7f.firebaseapp.com",
    projectId: "mozan-76e7f",
    storageBucket: "mozan-76e7f.firebasestorage.app",
    messagingSenderId: "985866702235",
    appId: "1:985866702235:web:2f0553ada762050d8ce53e",
    measurementId: "G-KWE32SGRE7"
  };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("upload-form");
    const submitBtn = document.getElementById("submit-btn");
    const statusMsg = document.getElementById("status-msg");

    function setStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = `status-${type}`;
      statusMsg.style.display = "block";
    }

    // Fast & Safe Image Compression using createImageBitmap
    async function compressImage(file, maxWidth = 400) {
      try {
        const imageBitmap = await createImageBitmap(file);
        const canvas = document.createElement("canvas");
        
        let width = imageBitmap.width;
        let height = imageBitmap.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(imageBitmap, 0, 0, width, height);

        return canvas.toDataURL("image/jpeg", 0.6);
      } catch (e) {
        // Fallback: Read directly without compression if browser bitmap fails
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (event) => resolve(event.target.result);
          reader.readAsDataURL(file);
        });
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const price = document.getElementById("price").value;
      const desc = document.getElementById("description").value.trim();
      const fileInput = document.getElementById("image-file");
      const file = fileInput.files[0];

      if (!file) {
        setStatus("Please select an image file.", "error");
        return;
      }

      submitBtn.disabled = true;
      setStatus("Processing and uploading...", "info");

      try {
        // 1. Process/Compress Image
        const imageBase64 = await compressImage(file);

        // 2. Upload to Firestore
        await addDoc(collection(db, "ff_ids"), {
          title: title,
          price: price,
          description: desc,
          image: imageBase64,
          createdAt: serverTimestamp()
        });

        setStatus("Uploaded successfully! 🔥", "success");
        form.reset();
      } catch (error) {
        console.error("Upload error:", error);
        setStatus("Error: " + error.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
