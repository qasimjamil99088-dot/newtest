<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Upload Free Fire IDs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card {
      width: 420px;
      padding: 2rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: #fff;
    }
    .admin-card h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; color: #aaa; margin-bottom: 0.4rem; font-size: 0.85rem; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95rem;
    }
    .upload-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c);
      color: #121417;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .upload-btn:hover { transform: scale(1.02); }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>Upload Free Fire ID 🔥</h2>
    <form id="upload-form">
      <div class="form-group">
        <label>Account Title / ID Name</label>
        <input type="text" id="title" placeholder="e.g., Level 75 Pro Account" required>
      </div>

      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="price" placeholder="e.g., 50" required>
      </div>

      <div class="form-group">
        <label>Image (Upload PNG / JPG File)</label>
        <input type="file" id="image-file" accept="image/*" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="EVO Guns, Rare Bundles..." required></textarea>
      </div>

      <button type="submit" class="upload-btn">Upload Account</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // FIXME: Add your firebase config keys here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value;
      const price = document.getElementById("price").value;
      const desc = document.getElementById("description").value;
      const fileInput = document.getElementById("image-file");
      const file = fileInput.files[0];

      if (!file) return alert("Please select an image file.");

      // Convert image file to Base64 format to save into Firestore directly
      const reader = new FileReader();
      reader.onload = async function(event) {
        const imageBase64 = event.target.result;

        try {
          await addDoc(collection(db, "ff_ids"), {
            title: title,
            price: price,
            description: desc,
            image: imageBase64,
            createdAt: serverTimestamp()
          });

          alert("Free Fire ID Uploaded Successfully!");
          document.getElementById("upload-form").reset();
        } catch (error) {
          alert("Error: " + error.message);
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
