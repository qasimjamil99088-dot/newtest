<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Upload Free Fire IDs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card {
      width: 420px;
      padding: 2rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: #fff;
    }
    .admin-card h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; color: #aaa; margin-bottom: 0.4rem; font-size: 0.85rem; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95rem;
    }
    .upload-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c);
      color: #121417;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .upload-btn:hover { transform: scale(1.02); }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status Message Styling */
    #status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .status-info { background: rgba(0, 200, 255, 0.2); color: #00ffff; }
    .status-success { background: rgba(0, 255, 128, 0.2); color: #00ff80; }
    .status-error { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>Upload Free Fire ID 🔥</h2>
    <form id="upload-form">
      <div class="form-group">
        <label>Account Title / ID Name</label>
        <input type="text" id="title" placeholder="e.g., Level 75 Pro Account" required>
      </div>

      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="price" placeholder="e.g., 50" required>
      </div>

      <div class="form-group">
        <label>Image (PNG/JPG)</label>
        <input type="file" id="image-file" accept="image/*" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="EVO Guns, Rare Bundles..." required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="upload-btn">Upload Account</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // FIXME: Replace with your actual Firebase config keys
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("upload-form");
    const submitBtn = document.getElementById("submit-btn");
    const statusMsg = document.getElementById("status-msg");

    function setStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = `status-${type}`;
      statusMsg.style.display = "block";
    }

    // Helper: Compress Image to prevent Firestore document size limit issues
    function compressImage(file, maxWidth = 500) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scaleSize = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? (img.height * scaleSize) : img.height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Compress to JPEG with 0.7 quality
            resolve(canvas.toDataURL("image/jpeg", 0.7));
          };
          img.onerror = (err) => reject("Image processing failed.");
        };
        reader.onerror = (err) => reject("Failed to read file.");
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const price = document.getElementById("price").value;
      const desc = document.getElementById("description").value.trim();
      const fileInput = document.getElementById("image-file");
      const file = fileInput.files[0];

      if (!file) {
        setStatus("Please select an image file.", "error");
        return;
      }

      submitBtn.disabled = true;
      setStatus("Compressing and uploading...", "info");

      try {
        // 1. Compress Image
        const compressedBase64 = await compressImage(file);

        // 2. Upload to Firestore
        await addDoc(collection(db, "ff_ids"), {
          title: title,
          price: price,
          description: desc,
          image: compressedBase64,
          createdAt: serverTimestamp()
        });

        setStatus("Uploaded successfully! 🔥", "success");
        form.reset();
      } catch (error) {
        console.error("Upload error:", error);
        setStatus("Error: " + error.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
