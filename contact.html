<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Navigation Bar Styling */
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.5rem;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Color change when hovering over the navbar */
    .navbar:hover {
      background: rgba(212, 163, 115, 0.15); /* Accent tint */
      border-color: rgba(212, 163, 115, 0.4);
      box-shadow: 0 10px 35px rgba(212, 163, 115, 0.25);
    }

    .nav-link {
      color: #ccc;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      transition: color 0.3s ease, background 0.3s ease;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    .nav-link.active {
      color: #121417;
      background: var(--accent-color, #d4a373);
      font-weight: 600;
    }

    /* Adjust page layout for fixed navbar */
    body {
      padding-top: 80px;
    }

    /* Specific styles for Contact page card */
    .contact-card {
      width: 400px;
      padding: 2.5rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: #fff;
    }

    .contact-card h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .contact-card p {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      color: #999;
      margin-bottom: 0.5rem;
      margin-left: 5px;
      font-size: 0.85rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid transparent;
      border-radius: 15px;
      outline: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
      transition: 0.3s;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent-color, #d4a373);
      background: rgba(255, 255, 255, 0.12);
    }

    .send-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #121417;
      background: linear-gradient(
        135deg,
        #bf953f,
        #fcf6ba,
        #b38728,
        #fcf6ba,
        #aa771c
      );
      transition: 0.3s;
    }

    .send-btn:hover {
      transform: scale(1.02);
      background: var(--lamp-shade, #f5f0e6);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="home.html" class="nav-link">Home</a>
    <a href="contact.html" class="nav-link active">Contact</a>
    <a href="about.html" class="nav-link">About Us</a>
  </nav>

  <!-- Contact Form Card -->
  <div class="contact-card">
    <h1>Contact Us 📩</h1>
    <p>Have questions? Send us a message!</p>

    <form onsubmit="return false;">
      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Your Name" required>
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="send-btn">Send Message</button>
    </form>
  </div>

</body>
</html>
